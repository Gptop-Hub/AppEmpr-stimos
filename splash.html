<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sistema de Empréstimos</title>
  <link rel="stylesheet" href="./splash.css" />
</head>
<body>
  <main class="splash-shell" role="status" aria-live="polite">
    <section class="splash-card">
      <div class="brand-mark" aria-hidden="true">
        <svg viewBox="0 0 64 64" class="brand-mark__svg">
          <defs>
            <linearGradient id="mark-gradient" x1="0" y1="0" x2="1" y2="1">
              <stop offset="0%" stop-color="#38bdf8" />
              <stop offset="100%" stop-color="#22c55e" />
            </linearGradient>
          </defs>
          <circle cx="32" cy="32" r="26" fill="rgba(15,23,42,0.55)" />
          <path d="M18 38h28v6H18zM20 20h24v14H20z" fill="url(#mark-gradient)" />
          <path d="M26 24h12M26 29h12" stroke="#08111f" stroke-width="2.2" stroke-linecap="round" />
        </svg>
        <span class="brand-mark__glow"></span>
      </div>

      <h1 class="title">Sistema de Empréstimos</h1>
      <p class="subtitle">Inicializando sistema...</p>

      <div class="loader" aria-hidden="true">
        <span class="loader__ring"></span>
        <span class="loader__dot"></span>
      </div>
    </section>
  </main>
</body>
</html>
